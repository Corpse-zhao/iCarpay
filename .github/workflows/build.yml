name: Build iCarpay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # roothide（iOS 15/16，随机 jbroot，Sileo 只认 iphoneos-arm64e）
          - variant: roothide
            arch: iphoneos-arm64e
            cflags: "-DSHOWCASE_ROOTLESS=1"
            debian: packaging/roothide
          # rootful（unc0ver / checkra1n 系，真 /Applications、/usr/bin）
          - variant: rootful
            arch: iphoneos-arm
            cflags: "-DICARPAY_SLOW_BT_READY=1"
            debian: packaging/rootful
    env:
      PKG_ARCH: ${{ matrix.arch }}
      PKG_ID: com.corpsezhao.icarpay

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          clang --version

      - name: Install ldid
        run: brew install ldid

      # ── iOS SDK：与既有越狱工程同款做法，sparse checkout 单个版本 ──
      - name: Fetch iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cd "$RUNNER_TEMP/sdks"
          git sparse-checkout set iPhoneOS14.5.sdk
          echo "SDK=$RUNNER_TEMP/sdks/iPhoneOS14.5.sdk" >> "$GITHUB_ENV"
          ls "$RUNNER_TEMP/sdks"

      - name: Read version
        run: |
          V="$(cat VERSION | tr -d '[:space:]')"
          # Showcase 的版本号形如 1.0~beta5-2，deb 版本号里 ~ 合法，直接用
          echo "PKG_VERSION=$V" >> "$GITHUB_ENV"
          echo "iCarpay version: $V"

      # ── 1. libBTstack：上游只把它放在历史 deb 里，这里用同一套源码自己编 ──
      #    carplay_bt 只用到 3 个接口（set_power_mode / set_discoverable /
      #    set_system_bluetooth_enabled），所以只需要 daemon 的客户端部分。
      - name: Build libBTstack.dylib
        run: |
          set -euo pipefail
          mkdir -p build
          BT=btstack-rootless
          clang -dynamiclib -arch arm64 -mios-version-min=12.0 -isysroot "$SDK" \
            -fno-objc-arc -O2 \
            -DHAVE_UNIX_SOCKETS \
            -I"$BT/src" -I"$BT/platform/daemon/src" -I"$BT/platform/posix" \
            -I"$BT/platform/corefoundation" -I"$BT/port/ios" \
            -Wno-deprecated-declarations -Wno-incompatible-pointer-types \
            -Wno-unused-command-line-argument \
            "$BT/platform/daemon/src/btstack.c" \
            "$BT/platform/daemon/src/daemon_cmds.c" \
            "$BT/platform/daemon/src/socket_connection.c" \
            "$BT/src/hci_cmd.c" \
            "$BT/src/hci_dump.c" \
            "$BT/src/btstack_linked_list.c" \
            "$BT/src/btstack_util.c" \
            "$BT/src/btstack_run_loop.c" \
            "$BT/src/btstack_run_loop_base.c" \
            "$BT/src/btstack_memory.c" \
            "$BT/src/btstack_memory_pool.c" \
            "$BT/src/classic/sdp_util.c" \
            "$BT/platform/posix/btstack_run_loop_posix.c" \
            tools/btstack_legacy.c \
            -framework Foundation -framework CoreFoundation \
            -Wl,-undefined,error \
            -install_name @loader_path/libBTstack.dylib \
            -o build/libBTstack.dylib
          lipo -info build/libBTstack.dylib
          # 先把 nm 输出落到文件再 grep。
          # 直接 `nm | grep -q` 会因为 grep 提前退出触发 SIGPIPE，
          # LLVM 的 nm 直接报 "IO failure on output stream: Broken pipe"
          # 并截断输出，断言就会随机假失败（上一轮 hci_disconnect 误报即此因）。
          nm -gU build/libBTstack.dylib > build/libBTstack.exported
          nm -u  build/libBTstack.dylib > build/libBTstack.undefined
          echo "--- libBTstack 未解析符号（应只有 /usr/lib、/System 里的系统符号） ---"
          sed 's/^[[:space:]]*//' build/libBTstack.undefined | sort -u
          # carplay_bt 引用的命令模板必须全部在库里，缺一个设备上就是 dyld 崩溃
          grep -E 'btstack_set_(power_mode|discoverable|system_bluetooth)' \
               build/libBTstack.exported || true
          for sym in hci_read_bd_addr hci_write_local_name hci_write_class_of_device \
                     hci_write_simple_pairing_mode hci_write_extended_inquiry_response \
                     hci_accept_connection_request hci_io_capability_request_reply \
                     hci_user_confirmation_request_reply hci_disconnect \
                     rfcomm_register_service_cmd rfcomm_accept_connection_cmd \
                     rfcomm_create_channel_cmd sdp_register_service_record_cmd \
                     sdp_client_query_rfcomm_services_cmd \
                     run_loop_init run_loop_execute run_loop_set_timer \
                     run_loop_set_timer_handler run_loop_add_timer \
                     run_loop_remove_timer bt_open bt_send_cmd \
                     bt_send_rfcomm bt_send_l2cap bt_close \
                     bt_register_packet_handler hci_cmd_create_from_template \
                     socket_connection_init socket_connection_send_packet; do
            grep -q " _${sym}\$" build/libBTstack.exported \
              || { echo "❌ libBTstack 缺符号: $sym"; exit 1; }
          done
          echo "✅ 全部命令模板就位"

      # ── 2. BTdaemon：与上游同一个脚本，只是把 SDK/ent/out 都指到本地 ──
      - name: Build BTdaemon
        run: |
          set -euo pipefail
          chmod +x btstack-rootless/build_btdaemon.sh
          SDK="$SDK" \
          ENT="$PWD/source/ent_btdaemon.xml" \
          OUT="$PWD/build/BTdaemon" \
            zsh btstack-rootless/build_btdaemon.sh
          lipo -info build/BTdaemon
          # BTdaemon 是独立进程，用 dynamic_lookup 编出来的缺符号可执行文件
          # 会在设备上启动即崩（dyld: missing symbol called，且不打印符号名）
          # 同样先落文件，避免 `nm | grep -q` 的 SIGPIPE 截断
          nm -u build/BTdaemon > build/BTdaemon.undefined
          echo "--- BTdaemon 未解析符号（应只有系统库） ---"
          sed 's/^[[:space:]]*//' build/BTdaemon.undefined | sort -u
          if grep -qE '^_?(bt_|hci_|rfcomm_|sdp_|l2cap_|run_loop_|btstack_|socket_connection_)' \
                    build/BTdaemon.undefined; then
            echo "❌ BTdaemon 存在自身未解析的 BTstack 符号（会启动即崩）"
            grep -E '^_?(bt_|hci_|rfcomm_|sdp_|l2cap_|run_loop_|btstack_|socket_connection_)' \
                 build/BTdaemon.undefined
            exit 1
          fi

      # ── 3. 三个 App 内可执行体 ──
      - name: Build app binaries
        run: |
          set -euo pipefail
          # ⚠️ 这里绝对不能出现 -Wl,-undefined,dynamic_lookup。
          #    ld64 只要见过一次 dynamic_lookup，缺符号就会一路留到运行期，
          #    真机上表现成无符号名的 "dyld: missing symbol called"，完全没法定位。
          #    需要 dynamic_lookup 的产物（Showcase / carplay_services）单独加。
          CF="-fobjc-arc -miphoneos-version-min=12.0 -isysroot $SDK -O2 \
              -Wno-deprecated-declarations -Wno-unused-command-line-argument"

          # 主 App
          clang $CF ${{ matrix.cflags }} \
            -DAPP_VERSION=\"$PKG_VERSION\" -DPACKAGE_VERSION=\"$PKG_VERSION\" \
            -o build/Showcase source/Showcase.m \
            -Wl,-undefined,dynamic_lookup \
            -framework UIKit -framework AVFoundation -framework AudioToolbox \
            -framework CoreMedia -framework Foundation -framework Security

          # 蓝牙辅助（唯一链接 libBTstack 的）
          # -undefined,error：缺符号必须在构建期炸，不许等到设备上 dyld 崩
          clang $CF ${{ matrix.cflags }} \
            -o build/CarDisplaySim source/carplay_bt.m build/libBTstack.dylib \
            -Wl,-undefined,error \
            -framework Foundation -framework Security

          # AirPlay / 认证服务
          clang $CF ${{ matrix.cflags }} \
            -o build/carplay_services source/carplay_services.m source/carplay_pair.c \
            source/vendor/monocypher/monocypher.c \
            source/vendor/monocypher/monocypher-ed25519.c \
            source/vendor/libtommath/tommath.c \
            -Wl,-undefined,dynamic_lookup \
            -framework Foundation -framework Security

          for b in Showcase CarDisplaySim carplay_services; do
            echo "--- $b"; lipo -info "build/$b"
            echo "--- $b 未解析符号（应只有系统库） ---"
            nm -u "build/$b" 2>/dev/null | sed 's/^[[:space:]]*//' | sort -u || true
          done

      # ── 4. 组 payload（roothide：相对路径，不带 var/jb） ──
      - name: Assemble payload
        run: |
          set -euo pipefail
          P=build/payload
          APP="$P/Applications/iCarpay.app"
          mkdir -p "$APP" "$P/usr/bin" "$P/usr/share/icarpay" "$P/Library/LaunchDaemons"

          cp build/Showcase            "$APP/Showcase"
          cp build/CarDisplaySim       "$APP/CarDisplaySim"
          cp build/carplay_services    "$APP/CarPlay Simulator"
          cp build/libBTstack.dylib    "$APP/libBTstack.dylib"
          cp source/Info.plist         "$APP/Info.plist"

          # Info.plist 的版本必须跟 control 的 Version 一致。
          # 之前 CFBundleShortVersionString 写死 0.1.7，包管理器显示的一直是旧版本，
          # 跟 deb 元数据、诊断报告里的 version= 全都对不上。
          python3 - "$PKG_VERSION" <<'PY'
          import re, sys, pathlib
          v = sys.argv[1]
          p = pathlib.Path("build/payload/Applications/iCarpay.app/Info.plist")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r"(<key>CFBundleShortVersionString</key>\s*<string>)[^<]*(</string>)",
                     lambda m: m.group(1) + v + m.group(2), s)
          s = re.sub(r"(<key>CFBundleVersion</key>\s*<string>)[^<]*(</string>)",
                     lambda m: m.group(1) + v.replace(".", "") + m.group(2), s)
          p.write_text(s, encoding="utf-8")
          print("Info.plist version ->", v)
          PY

          cp icon/generated/*.png      "$APP/"
          cp -R source/Localizations/*.lproj "$APP/"
          cp source/ent_*.xml          "$P/usr/share/icarpay/"
          cp build/BTdaemon            "$P/usr/bin/BTdaemon"
          cp ${{ matrix.debian }}/ch.ringwald.BTstack.plist "$P/Library/LaunchDaemons/"

          find "$P" -name '.DS_Store' -delete
          find "$P" -type f | sort

      # ── 5. 用 entitlements 签名（BAA 的钥匙就在这里） ──
      - name: Sign with entitlements
        run: |
          set -euo pipefail
          APP=build/payload/Applications/iCarpay.app
          ldid -S "$APP/libBTstack.dylib"
          ldid -Ssource/ent_app.xml       "$APP/Showcase"
          ldid -Ssource/ent_bt.xml        "$APP/CarDisplaySim"
          ldid -Ssource/ent_svc.xml       "$APP/CarPlay Simulator"
          ldid -Ssource/ent_btdaemon.xml  build/payload/usr/bin/BTdaemon
          echo "--- entitlements 自检（必须能看到 deviceidentity / attestation / keystore）"
          ldid -e "$APP/CarPlay Simulator" | grep -E 'deviceidentity|attestation|keystore|no-sandbox' || {
            echo "❌ ent_svc 未生效"; exit 1; }

      # ── 6. 打包（纯 Python，不依赖 dpkg-deb） ──
      #    只出 deb。ipa 形态在 0.1.9 之后不再构建：蓝牙/HCI 必须由 root
      #    守护进程持有，App 进程拿不到，ipa 装上也走不通那条路。
      #    详见 README「为什么车机端不是纯 IPA」。
      - name: Package .deb
        run: |
          set -euo pipefail
          DEB="build/${PKG_ID}_${PKG_VERSION}_${PKG_ARCH}.deb"
          python3 tools/make_deb.py \
            --payload build/payload \
            --debian  ${{ matrix.debian }} \
            --version "$PKG_VERSION" \
            --arch    "$PKG_ARCH" \
            --out     "$DEB"
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      # ── 7. 回读校验（结构错了就别上传） ──
      - name: Verify package
        run: |
          python3 - <<'PY'
          import io, os, tarfile
          p = os.environ["DEB"]
          raw = open(p, "rb").read()
          assert raw.startswith(b"!<arch>\n"), "ar magic 错误"
          off, members = 8, {}
          while off < len(raw):
              hdr = raw[off:off+60]
              if len(hdr) < 60: break
              name = hdr[0:16].decode().strip().rstrip("/")
              size = int(hdr[48:58].decode().strip())
              off += 60
              members[name] = raw[off:off+size]
              off += size + (size % 2)
          print("ar members:", list(members))

          with tarfile.open(fileobj=io.BytesIO(members["control.tar.gz"]), mode="r:gz") as tf:
              names = {ti.name.lstrip("./"): ti for ti in tf.getmembers()}
              for s in ("postinst", "prerm", "postrm"):
                  ti = names[s]
                  assert ti.mode == 0o755, "%s 权限必须是 0755，实际 %o" % (s, ti.mode)
              ctl = tf.extractfile(names["control"]).read().decode()
              arch = os.environ["PKG_ARCH"]
              assert ("Architecture: " + arch) in ctl, "Architecture 必须是 " + arch
              assert "Package: com.corpsezhao.icarpay" in ctl
              print("control OK / 脚本权限 OK / arch=%s" % arch)

          with tarfile.open(fileobj=io.BytesIO(members["data.tar.gz"]), mode="r:gz") as tf:
              entries = {ti.name.lstrip("./"): ti for ti in tf.getmembers()}
              names = ["./" + k for k in entries]
              for bad in names:
                  assert not bad.startswith("./var/jb"), "包内不能带 var/jb 前缀: " + bad
              must = ["Applications/iCarpay.app/Showcase",
                      "Applications/iCarpay.app/CarPlay Simulator",
                      "usr/bin/BTdaemon",
                      "Library/LaunchDaemons/ch.ringwald.BTstack.plist"]
              for m in must:
                  assert m in entries, "缺文件: " + m
              # 占位符只属于 roothide：rootful 的 plist 必须是真实绝对路径
              plist = tf.extractfile(entries["Library/LaunchDaemons/ch.ringwald.BTstack.plist"]).read().decode()
              prog = plist.split("ProgramArguments")[1].split("</array>")[0]
              if arch.endswith("arm64e"):
                  assert "__JBROOT__" in prog, "roothide 版 ProgramArguments 必须保留 __JBROOT__"
              else:
                  assert "__JBROOT__" not in prog, "rootful 版 ProgramArguments 不能有占位符"
                  assert "<string>/usr/bin/BTdaemon</string>" in prog, "rootful plist 必须写 /usr/bin/BTdaemon"
              print("payload 共 %d 项" % len(names))
          print("✅ 包结构校验通过")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icarpay-${{ matrix.variant }}
          path: build/*.deb
          if-no-files-found: error
